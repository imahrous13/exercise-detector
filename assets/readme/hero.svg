<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Taqwin - ST-GCN exercise detector</title>
  <desc id="svgDesc">Project identity: Taqwin, an ST-GCN exercise detector. YOLOv8-Pose extracts a 17-joint skeleton; a spatial-temporal graph CNN classifies the exercise, scores form quality and counts repetitions. The panel shows a real skeleton motion study - three frames of one biceps curl from the repository's own data - with the tracked wrist trajectory.</desc>
  <rect width="1200" height="460" rx="22" fill="#06090D"/>
    <text x="56.0" y="74.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#5CC8FF" text-anchor="start" letter-spacing="2.4">SKELETON-BASED EXERCISE RECOGNITION</text>
    <text x="54.0" y="146.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#EAF1F8" text-anchor="start" letter-spacing="-1.5">Taqwin</text>
    <text x="56.0" y="188.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#9FB0C2" text-anchor="start">ST-GCN Exercise Detector</text>
    <text x="56.0" y="238.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#68798B" text-anchor="start">YOLOv8-Pose extracts a 17-joint skeleton from video. A spatial-</text>
    <text x="56.0" y="266.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#68798B" text-anchor="start">temporal graph CNN then classifies the exercise, scores the form,</text>
    <text x="56.0" y="294.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#68798B" text-anchor="start">and counts every repetition.</text>
