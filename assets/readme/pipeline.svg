<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Taqwin pipeline: pose to exercise class, rule-based form and rep output</title>
  <desc id="svgDesc">Video frames become 17-keypoint poses via YOLOv8-Pose with ROI cropping and EMA smoothing, then hip-centred and torso-scaled. The skeleton tensor and the 12 joint angles run through two parallel branches - four ST-GCN blocks and a small angle MLP - are concatenated into a 576-wide sequence and modelled by a bidirectional LSTM. The model has three heads; only the exercise head reaches the user. Form score, fault messages and repetition counting come from the deterministic rule engine, which runs at inference as well as at label generation time.</desc>
